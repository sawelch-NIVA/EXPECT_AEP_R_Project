project:
  type: website
  output-dir: _site
  # Explicit render list, added 2026-07-29. Without this, `quarto render`
  # rebuilds every .qmd in the project, which is the single biggest cost in the
  # build. Only documents under active work belong here. Parked notebooks still
  # exist on disk and can be rendered individually with
  # `quarto render docs/<file>.qmd`; they are just not part of a project build.
  render:
    - index.qmd
    - docs/NBXX-Sample-Groups.qmd
    # - docs/NBXX-Triage.qmd   # Phase 2, once it exists

website:
  title: "EXPECT Copper AEP"
  sidebar:
    style: "docked" 
    search: true
    # Sidebar trimmed 2026-07-29 to match the render list above. Entries
    # pointing at parked notebooks were removed: they would render as broken
    # links, since those files are no longer built into _site.
    contents:
      - section: "Article"
        contents:
          - href: index.qmd
            text: "Manuscript Draft"
      - section: "Notebooks"
        contents:
          - href: docs/NBXX-Sample-Groups.qmd
            text: "Sample Groups"
            icon: journal-code
          # - href: docs/NBXX-Triage.qmd   # Phase 2, once it exists
          #   text: "Group Triage"
          #   icon: journal-code

# acronyms:
#   keys:
#     - shortname: AEP
#       longname: Aggregate Exposure Pathway

execute:
  freeze: auto
  echo: false                        # suppresses code echo by default
  warning: false                     # suppresses warnings even when echo is off
  message: false                     # suppresses package load messages (library() etc.)

knitr:
  opts_chunk:
    dpi: 300                         # belt-and-braces for knitr devices
    dev: "ragg_png"                  # use ragg for better font rendering

filters:
  - flextable-qmd                    # needed, or the flextables render crazy
  - at: post-render
    path: _extensions/flextable-qmd/unwrap-float.lua


format:
  html:
    code-fold: true
    code-overflow: wrap
    fig-format: svg
    toc: true
    grid:
      sidebar-width: 400px
    monofont: "Fira Code"
    fig-height: 8
    fig-width: 12
    embed-resources: true # experimental, avoids creating *_files folders
  # docx:
  #   reference-doc: custom-reference-doc.docx
  #   fig-width: 8
  #   fig-height: 6
  #   fig-dpi: 300
  #   fig-format: png
  #   link-citations: true
  #   link-bibliography: true


